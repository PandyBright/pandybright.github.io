name: Archive visitor map locations

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: archive-visitor-map-locations

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Archive visitor locations
        run: node scripts/archive_visitor_locations.cjs

      - name: Save any new locations
        run: |
          if git diff --quiet -- assets/visitor-history.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/visitor-history.json
          git commit -m 'Archive new visitor map locations'
          git push origin HEAD:main

      - name: Refresh GitHub Pages when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=$(mktemp)
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] &&
             curl --fail --silent --show-error --max-time 15 "https://pandybright.github.io/assets/visitor-history.json?v=${GITHUB_RUN_ID}" -o "$published" &&
             cmp -s "$published" assets/visitor-history.json; then
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq .status
