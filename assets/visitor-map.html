<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https://pandybright.github.io https://service.supercounters.com; img-src 'self' https://pandybright.github.io; connect-src 'self' https://pandybright.github.io; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Visitor Map</title>
  <style>
    body { margin: 0; overflow: hidden; color-scheme: light dark; font: 14px system-ui, sans-serif; }
    #map { display: block; width: 100%; height: auto; }
    #status {
      position: absolute;
      inset: auto 0.25rem 0.25rem;
      margin: 0;
      color: #293b59;
      text-align: center;
      font-size: 0.75rem;
    }
    #points { position: absolute; inset: 0; pointer-events: none; }
    .map-point {
      position: absolute;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .map-point::before {
      display: block;
      width: 6px;
      height: 6px;
      margin: auto;
      border: 1px solid #fff;
      border-radius: 50%;
      background: #f25a65;
      content: "";
    }
    .map-point:hover::before, .map-point:focus-visible::before {
      box-shadow: 0 0 0 3px #fff8;
    }
    #city-label {
      position: absolute;
      width: max-content;
      max-width: calc(100% - 8px);
      box-sizing: border-box;
      padding: 0.28rem 0.45rem;
      border-radius: 0.28rem;
      background: #142449;
      color: #fff;
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img id="map" src="./visitor-world.png" alt="World map" width="640" height="320">
  <p id="status" role="status">Loading visitor points…</p>
  <div id="points" role="group" aria-label="Visitor locations"></div>
  <div id="city-label" aria-hidden="true" hidden></div>
  <script src="./visitor-locations.js?v=2"></script>
  <script>
    var sc_map_var = [];

    const statusMessage = document.querySelector("#status");
    const pointLayer = document.querySelector("#points");
    const cityLabel = document.querySelector("#city-label");
    const markers = new Map();
    let activeMarker;

    function showCity(button) {
      activeMarker = button;
      cityLabel.textContent = button.getAttribute("aria-label");
      cityLabel.hidden = false;
      const marker = button.getBoundingClientRect();
      const center = marker.left + marker.width / 2;
      const left = Math.max(4, Math.min(center - cityLabel.offsetWidth / 2, innerWidth - cityLabel.offsetWidth - 4));
      const above = marker.top - cityLabel.offsetHeight - 1;
      const top = above < 4 ? marker.bottom + 1 : above;
      cityLabel.style.left = left + "px";
      cityLabel.style.top = Math.max(4, Math.min(top, innerHeight - cityLabel.offsetHeight - 4)) + "px";
    }

    function renderLocations(history, recent, capturedAt) {
      const locations = new Map();
      for (const location of history) locations.set(visitorLocationKey(location), location);
      for (const location of recent) locations.set(visitorLocationKey(location), location);
      const asOf = capturedAt ? ` (as of ${capturedAt})` : "";

      for (const [key, { la, lo, address, count }] of locations) {
        let button = markers.get(key);
        if (!button) {
          button = document.createElement("button");
          button.className = "map-point";
          button.type = "button";
          button.style.left = ((lo + 180) / 3.6) + "%";
          button.style.top = ((90 - la) / 1.8) + "%";
          button.addEventListener("pointerenter", () => showCity(button));
          button.addEventListener("pointerleave", (event) => {
            if (event.pointerType !== "touch" && document.activeElement !== button) cityLabel.hidden = true;
          });
          button.addEventListener("focus", () => showCity(button));
          button.addEventListener("blur", () => { cityLabel.hidden = true; });
          button.addEventListener("click", () => showCity(button));
          markers.set(key, button);
          pointLayer.append(button);
        }
        const visits = count === 1 ? "1 visit" : `${count} visits`;
        button.setAttribute("aria-label", count ? `${visits} from ${address}${asOf}` : address);
      }
      if (activeMarker && !cityLabel.hidden) showCity(activeMarker);
      statusMessage.hidden = markers.size > 0;
    }

    async function fetchMapData(filename, timeout = 12000) {
      try {
        const response = await fetch(`./${filename}${window.location.search}`, {
          credentials: "omit",
          signal: AbortSignal.timeout(timeout)
        });
        if (response.ok) return await response.json();
      } catch { /* The other map data sources can still be displayed. */ }
    }

    function fetchRecentPoints() {
      return new Promise(resolve => {
        const timeout = setTimeout(() => resolve([]), 20000);
        // Supercounters sends the newest coordinates through this callback.
        window.sc_show_map = (id, payload) => {
          if (id !== 1741601 || typeof payload !== "string") return;
          clearTimeout(timeout);
          try {
            const points = JSON.parse(payload.slice(1, -1));
            resolve(Array.isArray(points) ? points : []);
          } catch {
            resolve([]);
          }
        };
        const counter = document.createElement("script");
        counter.src = "https://service.supercounters.com/fc.php?id=1741601&w=4&rand=" + Date.now();
        counter.addEventListener("error", () => {
          clearTimeout(timeout);
          resolve([]);
        });
        document.head.append(counter);
      });
    }

    const savedLocations = Promise.all([fetchMapData("visitor-history.json"), fetchMapData("visitor-recent.json")])
      .then(([history, snapshot]) => {
        const archived = Array.isArray(history) ? history.filter(location => location?.address) : [];
        if (!Array.isArray(snapshot?.locations) || !Number.isFinite(Date.parse(snapshot.capturedAt))) {
          renderLocations(archived, []);
          return archived;
        }
        const capturedAt = new Intl.DateTimeFormat("en-GB", {
          dateStyle: "medium", timeStyle: "short", timeZone: "Asia/Hong_Kong"
        }).format(new Date(snapshot.capturedAt)) + " HKT";
        renderLocations(archived, snapshot.locations, capturedAt);
        return [...archived, ...snapshot.locations.map(({ la, lo, address }) => ({ la, lo, address }))];
      });

    // City names, centroids and provinces are adapted from GeoNames (CC BY 4.0).
    Promise.all([savedLocations, fetchRecentPoints(), fetchMapData("visitor-cities.json", 30000)])
      .then(([history, points, cities]) => {
        const recent = Array.isArray(cities) ? groupVisitorPoints(points, cities) : [];
        if (recent.some(location => location.count > 0)) renderLocations(history, recent);
        if (!markers.size) statusMessage.textContent = "No visitor locations available.";
      });

    window.addEventListener("resize", () => { cityLabel.hidden = true; });
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".map-point")) cityLabel.hidden = true;
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") cityLabel.hidden = true;
    });
  </script>
</body>
</html>
