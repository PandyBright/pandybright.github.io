<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://widget.supercounters.com https://service.supercounters.com; img-src 'self' https://pandybright.github.io; connect-src 'self' https://pandybright.github.io; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Visitor Map</title>
  <style>
    body { margin: 0; overflow: hidden; color-scheme: light dark; font: 14px system-ui, sans-serif; }
    #map { display: block; width: 100%; height: auto; }
    #status {
      position: absolute;
      inset: auto 0.25rem 0.25rem;
      margin: 0;
      color: #293b59;
      text-align: center;
      font-size: 0.75rem;
    }
    #points { position: absolute; inset: 0; pointer-events: none; }
    .map-point {
      position: absolute;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .map-point::before {
      display: block;
      width: 6px;
      height: 6px;
      margin: auto;
      border: 1px solid #fff;
      border-radius: 50%;
      background: #f25a65;
      content: "";
    }
    .map-point:hover::before, .map-point:focus-visible::before {
      box-shadow: 0 0 0 3px #fff8;
    }
    #city-label {
      position: absolute;
      width: max-content;
      max-width: calc(100% - 8px);
      box-sizing: border-box;
      padding: 0.28rem 0.45rem;
      border-radius: 0.28rem;
      background: #142449;
      color: #fff;
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img id="map" src="./visitor-world.png" alt="World map" width="640" height="320">
  <p id="status" role="status">Loading visitor points…</p>
  <div id="points" role="group" aria-label="Visitor locations"></div>
  <div id="city-label" aria-hidden="true" hidden></div>
  <script>
    var sc_map_var = [];

    const statusMessage = document.querySelector("#status");
    const pointLayer = document.querySelector("#points");
    const cityLabel = document.querySelector("#city-label");
    const regionNames = new Intl.DisplayNames(["en"], { type: "region" });

    function nearbyCity(latitude, longitude, cities) {
      const maxOffset = 0.32;
      const radians = Math.PI / 180;
      let bestDistance = maxOffset ** 2;
      let nearest;

      // Coordinates come from IP-based geolocation. Skip distant city matches.
      for (const entry of cities) {
        const [lat, lon] = entry;
        const latitudeOffset = latitude - lat;
        if (latitudeOffset > maxOffset) continue;
        if (latitudeOffset < -maxOffset) break;
        const longitudeOffset = ((longitude - lon + 540) % 360 - 180) * Math.cos((latitude + lat) * radians / 2);
        const distance = latitudeOffset ** 2 + longitudeOffset ** 2;
        if (distance < bestDistance) {
          bestDistance = distance;
          nearest = entry;
        }
      }
      if (!nearest) return;
      const [, , city, countryCode, province] = nearest;
      if (countryCode === "HK") return "Hong Kong · 香港";
      const region = province || regionNames.of(countryCode);
      return region === city ? city : city + ", " + region;
    }

    function showCity(button) {
      cityLabel.textContent = button.getAttribute("aria-label");
      cityLabel.hidden = false;
      const marker = button.getBoundingClientRect();
      const center = marker.left + marker.width / 2;
      const left = Math.max(4, Math.min(center - cityLabel.offsetWidth / 2, innerWidth - cityLabel.offsetWidth - 4));
      const above = marker.top - cityLabel.offsetHeight - 1;
      cityLabel.style.left = left + "px";
      cityLabel.style.top = (above < 4 ? marker.bottom + 1 : above) + "px";
    }

    function labelPoints(visitorPoints, cities) {
      const locations = new Set();
      for (const { la, lo } of visitorPoints) {
        if (!Number.isFinite(la) || !Number.isFinite(lo) || Math.abs(la) > 90 || Math.abs(lo) > 180) continue;
        const key = la + "," + lo;
        if (locations.has(key)) continue;
        locations.add(key);

        const city = nearbyCity(la, lo, cities);
        const button = document.createElement("button");
        button.className = "map-point";
        button.type = "button";
        button.style.left = ((lo + 180) / 3.6) + "%";
        button.style.top = ((90 - la) / 1.8) + "%";
        button.setAttribute("aria-label", city ? city + " (approx.)" : "City name unavailable");
        button.addEventListener("pointerenter", () => showCity(button));
        button.addEventListener("pointerleave", (event) => {
          if (event.pointerType !== "touch" && document.activeElement !== button) cityLabel.hidden = true;
        });
        button.addEventListener("focus", () => showCity(button));
        button.addEventListener("blur", () => { cityLabel.hidden = true; });
        button.addEventListener("click", () => showCity(button));
        pointLayer.append(button);
      }
      if (pointLayer.childElementCount) statusMessage.hidden = true;
      else statusMessage.textContent = "No recent visitor points.";
    }

    const timeout = setTimeout(() => { statusMessage.textContent = "Visitor points unavailable."; }, 8000);
    const counter = document.createElement("script");
    counter.src = "https://widget.supercounters.com/ssl/map.js";
    counter.addEventListener("load", () => {
      if (typeof sc_map !== "function") return;
      // The counter response has coordinates only. Render them on the on-site basemap.
      window.sc_show_map = async (id, payload) => {
        if (id !== 1741601 || typeof payload !== "string") return;
        let points;
        try {
          points = JSON.parse(payload.slice(1, -1));
        } catch {
          return;
        }
        if (!Array.isArray(points)) return;

        let cities = [];
        if (points.length) {
          try {
            // City names, centroids and provinces are adapted from GeoNames (CC BY 4.0).
            const response = await fetch("./visitor-cities.json", {
              credentials: "omit",
              signal: AbortSignal.timeout(5000)
            });
            if (response.ok) cities = await response.json();
          } catch {
            // Show the point even if its city name could not be loaded.
          }
        }
        clearTimeout(timeout);
        labelPoints(points, cities);
      };
      sc_map(1741601, "112288", "ff0000", 1);
    });
    counter.addEventListener("error", () => {
      clearTimeout(timeout);
      statusMessage.textContent = "Visitor points unavailable.";
    });
    document.head.append(counter);

    window.addEventListener("resize", () => { cityLabel.hidden = true; });
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".map-point")) cityLabel.hidden = true;
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") cityLabel.hidden = true;
    });
  </script>
</body>
</html>
