<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self' https://pandybright.github.io; img-src 'self' https://pandybright.github.io; connect-src 'self' https://pandybright.github.io; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Visitor Map</title>
  <style>
    body { margin: 0; overflow: hidden; color-scheme: light dark; font: 14px system-ui, sans-serif; }
    #map { display: block; width: 100%; height: auto; }
    #status {
      position: absolute;
      inset: auto 0.25rem 0.25rem;
      margin: 0;
      color: #293b59;
      text-align: center;
      font-size: 0.75rem;
    }
    #points { position: absolute; inset: 0; touch-action: manipulation; }
    #map-controls {
      position: absolute;
      bottom: 0.45rem;
      left: 50%;
      z-index: 2;
      padding: 0.3rem 0.42rem;
      border-radius: 0.35rem;
      background: #ffffffd9;
      color: #142449;
      font-size: 0.72rem;
      line-height: 1.2;
      box-shadow: 0 1px 5px #14244933;
      transform: translateX(-50%);
    }
    #magnifier-toggle { margin: 0 0.22rem 0 0; vertical-align: -1px; accent-color: #6e72e8; }
    .map-point {
      position: absolute;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .map-point::before {
      display: block;
      width: 5px;
      height: 5px;
      margin: auto;
      border: 1px solid #fff;
      border-radius: 50%;
      background: #f25a65;
      content: "";
    }
    .map-point[data-active]::before, .map-point:focus-visible::before {
      box-shadow: 0 0 0 3px #fff8;
    }
    #map-lens {
      position: absolute;
      width: 104px;
      height: 104px;
      box-sizing: border-box;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #e4eef8;
      box-shadow: 0 2px 12px #14244955;
      pointer-events: none;
    }
    #city-label {
      position: absolute;
      width: max-content;
      max-width: calc(100% - 8px);
      box-sizing: border-box;
      padding: 0.28rem 0.45rem;
      border-radius: 0.28rem;
      background: #142449;
      color: #fff;
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img id="map" src="./visitor-world.png" alt="World map" width="640" height="320">
  <label id="map-controls"><input id="magnifier-toggle" type="checkbox"> Magnify on hover</label>
  <p id="status" role="status">Loading visitor points…</p>
  <div id="points" role="group" aria-label="Visitor locations"></div>
  <canvas id="map-lens" width="208" height="208" aria-hidden="true" hidden></canvas>
  <div id="city-label" aria-hidden="true" hidden></div>
  <script src="./visitor-locations.js?v=3"></script>
  <script>
    const statusMessage = document.querySelector("#status");
    const mapImage = document.querySelector("#map");
    const pointLayer = document.querySelector("#points");
    const magnifierToggle = document.querySelector("#magnifier-toggle");
    const lens = document.querySelector("#map-lens");
    const lensContext = lens.getContext("2d");
    const cityLabel = document.querySelector("#city-label");
    const markers = new Map();
    const markerPositions = new Map();
    let activeMarker;
    let magnifierEnabled = false;

    function showCity(button) {
      if (activeMarker === button && cityLabel.textContent === button.getAttribute("aria-label")) return;
      activeMarker?.removeAttribute("data-active");
      activeMarker = button;
      button.setAttribute("data-active", "");
      cityLabel.textContent = button.getAttribute("aria-label");
      cityLabel.hidden = false;
      const marker = button.getBoundingClientRect();
      const center = marker.left + marker.width / 2;
      const left = Math.max(4, Math.min(center - cityLabel.offsetWidth / 2, innerWidth - cityLabel.offsetWidth - 4));
      const above = marker.top - cityLabel.offsetHeight - 1;
      const top = above < 4 ? marker.bottom + 1 : above;
      cityLabel.style.left = left + "px";
      cityLabel.style.top = Math.max(4, Math.min(top, innerHeight - cityLabel.offsetHeight - 4)) + "px";
    }

    function hideCity() {
      activeMarker?.removeAttribute("data-active");
      activeMarker = undefined;
      cityLabel.hidden = true;
    }

    // Pick the closest visible dot so a larger hit area cannot hide a neighboring city.
    function pointAt(event) {
      const radius = event.pointerType === "touch" ? 18 : 12;
      const bounds = pointLayer.getBoundingClientRect();
      let distance = radius ** 2;
      let closest;
      for (const [button, position] of markerPositions) {
        const x = bounds.left + position.left / 100 * bounds.width;
        const y = bounds.top + position.top / 100 * bounds.height;
        const offset = (x - event.clientX) ** 2 + (y - event.clientY) ** 2;
        if (offset >= distance) continue;
        closest = button;
        distance = offset;
      }
      return closest;
    }

    function selectPoint(event) {
      const point = pointAt(event);
      pointLayer.style.cursor = point ? "pointer" : "";
      if (point) showCity(point);
      else hideCity();
    }

    function magnify(event) {
      if (!magnifierEnabled || !lensContext || !mapImage.naturalWidth) return;
      const bounds = mapImage.getBoundingClientRect();
      const x = event.clientX - bounds.left;
      const y = event.clientY - bounds.top;
      const radius = lens.width / 2;
      const scale = 3;
      const left = radius - x * scale;
      const top = radius - y * scale;
      lensContext.clearRect(0, 0, lens.width, lens.height);
      lensContext.drawImage(mapImage, left, top, bounds.width * scale, bounds.height * scale);
      for (const [marker, position] of markerPositions) {
        const dotX = left + position.left / 100 * bounds.width * scale;
        const dotY = top + position.top / 100 * bounds.height * scale;
        if (Math.hypot(dotX - radius, dotY - radius) > radius + 12) continue;
        lensContext.beginPath();
        lensContext.arc(dotX, dotY, marker === activeMarker ? 9.5 : 7.5, 0, 2 * Math.PI);
        lensContext.fillStyle = "#f25a65";
        lensContext.strokeStyle = "#fff";
        lensContext.lineWidth = 3;
        lensContext.fill();
        lensContext.stroke();
      }
      lens.hidden = false;
      lens.style.left = Math.max(0, Math.min(x - lens.offsetWidth / 2, bounds.width - lens.offsetWidth)) + "px";
      lens.style.top = Math.max(0, Math.min(y - lens.offsetHeight / 2, bounds.height - lens.offsetHeight)) + "px";
    }

    function renderLocations(history, recent, capturedAt) {
      const locations = new Map();
      for (const location of history) locations.set(visitorLocationKey(location), location);
      for (const location of recent) locations.set(visitorLocationKey(location), location);
      const asOf = capturedAt ? ` (as of ${capturedAt})` : "";

      for (const [key, { la, lo, address, count }] of locations) {
        let button = markers.get(key);
        if (!button) {
          button = document.createElement("button");
          button.className = "map-point";
          button.type = "button";
          button.addEventListener("focus", () => showCity(button));
          button.addEventListener("blur", hideCity);
          button.addEventListener("click", () => showCity(button));
          markers.set(key, button);
          pointLayer.append(button);
        }
        const left = Math.max(0.6, Math.min(99.4, (lo + 180) / 3.6));
        const top = Math.max(1.2, Math.min(98.8, (90 - la) / 1.8));
        button.style.left = left + "%";
        button.style.top = top + "%";
        markerPositions.set(button, { left, top });
        const visits = count === 1 ? "1 visit" : `${count} visits`;
        button.setAttribute("aria-label", count ? `${visits} from ${address}${asOf}` : address);
      }
      if (activeMarker && !cityLabel.hidden) showCity(activeMarker);
      statusMessage.hidden = markers.size > 0;
    }

    async function fetchMapData(filename, timeout = 12000) {
      try {
        const response = await fetch(`./${filename}${window.location.search}`, {
          credentials: "omit",
          signal: AbortSignal.timeout(timeout)
        });
        if (response.ok) return await response.json();
      } catch { /* The other map data sources can still be displayed. */ }
    }

    function receiveLivePoints() {
      if (parent === window) return Promise.resolve(null);
      return new Promise(resolve => {
        const timeout = setTimeout(() => {
          window.removeEventListener("message", receive);
          resolve(null);
        }, 12000);
        function receive(event) {
          if (event.source !== parent || event.origin !== location.origin || !event.data ||
              !("visitorPoints" in Object(event.data))) return;
          clearTimeout(timeout);
          window.removeEventListener("message", receive);
          resolve(event.data.visitorPoints);
        }
        window.addEventListener("message", receive);
        parent.postMessage("visitor-map-ready", location.origin);
      });
    }

    const savedLocations = Promise.all([fetchMapData("visitor-history.json"), fetchMapData("visitor-recent.json")])
      .then(([history, snapshot]) => {
        const archived = Array.isArray(history) ? history.filter(location => location?.address) : [];
        if (!Array.isArray(snapshot?.locations) || !Number.isFinite(Date.parse(snapshot.capturedAt))) {
          renderLocations(archived, []);
          return archived;
        }
        const capturedAt = new Intl.DateTimeFormat("en-GB", {
          dateStyle: "medium", timeStyle: "short", timeZone: "Asia/Hong_Kong"
        }).format(new Date(snapshot.capturedAt)) + " HKT";
        renderLocations(archived, snapshot.locations, capturedAt);
        return [...archived, ...snapshot.locations.map(({ la, lo, address }) => ({ la, lo, address }))];
      });

    const liveLocations = receiveLivePoints().then(async points => {
      if (!Array.isArray(points) || !points.length) return [];
      const [cities, regions] = await Promise.all([fetchMapData("visitor-cities.json", 30000), fetchMapData("visitor-regions.json")]);
      return groupVisitorPoints(points, cities ?? [], regions ?? {});
    });
    Promise.all([savedLocations, liveLocations])
      .then(([history, recent]) => {
        if (recent.length) renderLocations(history, recent);
        if (!markers.size) statusMessage.textContent = "No visitor locations available.";
      });

    function hideLens() { lens.hidden = true; }

    magnifierToggle.addEventListener("change", () => {
      magnifierEnabled = magnifierToggle.checked;
      if (!magnifierEnabled) hideLens();
    });

    window.addEventListener("resize", () => {
      hideCity();
      hideLens();
    });
    pointLayer.addEventListener("pointermove", event => {
      if (event.pointerType !== "touch") selectPoint(event);
      if (event.pointerType === "mouse" && magnifierEnabled) magnify(event);
    });
    pointLayer.addEventListener("pointerleave", () => {
      hideLens();
      if (document.activeElement !== activeMarker) hideCity();
    });
    pointLayer.addEventListener("click", event => {
      if (event.target === pointLayer) selectPoint(event);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        hideCity();
        hideLens();
      }
    });
  </script>
</body>
</html>
