<details class="moon-note" data-easter-egg>
  <summary aria-label="Open the moon rabbit’s mail" title="Moon Mail">
    <img class="moon-note__seal" src="{{ '/assets/moon-seal.webp' | relative_url }}" width="88" height="88" alt="">
  </summary>
  <div class="moon-note__card">
    <img class="moon-note__art" src="{{ '/assets/moon-rabbit.webp' | relative_url }}" width="352" height="288" loading="lazy" alt="A moon rabbit in a lavender hoodie holding a stamped envelope">
    <div>
      <strong>Moon Mail</strong>
      <p class="moon-note__message" role="status">First day on Earth. I ordered milk tea with extra moon pearls.</p>
      <button class="moon-note__next" type="button" hidden>Next note <span aria-hidden="true">→</span></button>
    </div>
  </div>
</details>
