{% assign article = include.post %}
<li>
  <a href="{% if article.link %}{{ article.link | escape }}{% else %}{{ article.url | relative_url }}{% endif %}"{% if article.link %} target="_blank" rel="noopener noreferrer"{% endif %}>
    <span class="blog-posts__title"{% if article.link %} lang="zh-Hans"{% endif %}>{{ article.title | strip | escape }}</span>
    <time datetime="{{ article.date | date: '%Y-%m-%d' }}">{{ article.date | date: '%b %d, %Y' }}</time>
    <span class="blog-posts__arrow" aria-hidden="true">{% if article.link %}↗{% else %}→{% endif %}</span>
  </a>
</li>
